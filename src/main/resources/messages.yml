  cannot-buy-own: '&cYou cannot buy your own auction.'
  auction-expired: '&cThat auction has expired.'
  auction-processing: '&cThat auction is already being processed.'
  insufficient-funds: '&cYou do not have enough money.'
  withdraw-failed: '&cUnable to withdraw funds: %error%'
  pay-seller-failed: '&cUnable to pay the seller right now.'
