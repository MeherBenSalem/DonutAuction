  no-permission-reload: '&cYou do not have permission to reload this plugin.'
  no-permission-fastbuy: '&cYou do not have permission to use fast buy.'
  no-permission-fastsell: '&cYou do not have permission to use fast sell.'
  usage-sell: '&cUsage: /ah sell <price>'
  invalid-price: '&cInvalid price.'
  config-reloaded: '&aDonutAuctionHouse configuration reloaded.'
  limits-disabled: '&eAuction limits are not enabled.'
  limit-current: '&6Your current auction limit: %limit%'
  limit-listings: '&7Current listings: %count%'
  limit-remaining: '&7Remaining listings: %remaining%'
