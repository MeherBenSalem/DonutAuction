# ─────────────────────────────────────────────────────────────────────────────
#  DonutAuctionHouse  –  messages.yml
#
#  Edit this file to translate the entire plugin into your language.
#  No recompile needed — run:  /ah reload
#
#  Formatting:
#    &0–&f, &k–&o, &l, &m, &n, &r   standard Minecraft color/format codes
#
#  Placeholders:
#    %name% %price% %seller% …       named placeholders in templates
#
#  Inventory titles should stay short (ideally under ~32 characters).
# ─────────────────────────────────────────────────────────────────────────────

prefix: '&6&lAuctionHouse &8» '

# ── General ───────────────────────────────────────────────────────────────────
player-only: '&cOnly players can use this command.'
unknown-seller: Unknown

