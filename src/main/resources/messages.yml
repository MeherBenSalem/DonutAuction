# ─────────────────────────────────────────────────────────────────────────────
#  DonutAuctionHouse  –  messages.yml
#
#  Edit this file to translate the entire plugin into your language.
#  No recompile needed — run:  /ah reload
#
#  Formatting (mix freely):
#    &0–&f, &k–&o, &l, &m, &n, &r    legacy color/format codes
#    &#RRGGBB                         hex colors
#    <gold>, <#ffaa00>, <gradient:#f9d423:#ff4e50>text</gradient>, <bold> ...   MiniMessage
#
#  Placeholders:
#    %name% %price% %seller% …       named placeholders in templates. Values are inserted as plain
#                                    text, so player-made names can never add colors or click events.
#  Item names (%item%) are shown in each player's own client language unless the item was renamed.
#
#  Inventory titles should stay short (ideally under ~32 characters).
#  Lore lines are gray and not italic unless you color them.
# ─────────────────────────────────────────────────────────────────────────────

