name: Bug report
description: Report a bug in DonutAuctionHouse
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what actually happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: 1.3.1
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Paper or Folia version
      placeholder: Paper 1.21.4 / Folia 1.20.6
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant console or latest.log snippet (no secrets)
