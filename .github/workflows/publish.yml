# Publish DonutAuctionHouse to Modrinth and CurseForge on v*.*.* tags.
# One jar, one version, tagged Paper + Folia for every Minecraft version in
# release/supported-minecraft.json (1.20.1 through 26.3).
#
# Secrets: MODRINTH_TOKEN, CURSEFORGE_TOKEN, CURSEFORGE_API_KEY
# Variables: MODRINTH_ID, CURSEFORGE_ID

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v) when not tagging
        required: false
      dry_run:
        description: Skip uploads if true
        required: false
        default: "false"
      platforms:
        description: "modrinth, curseforge, or both"
        required: false
        default: "both"
      artifact_run_id:
        description: "Recover only missing uploads from this existing run's immutable jar"
        required: false

concurrency:
  group: donutauction-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify full CI for the exact release commit
        id: ci
        uses: actions/github-script@v7
        with:
          script: |
            const sourceSha = context.payload.workflow_run?.head_sha || context.sha;
            let run;
            if (context.payload.workflow_run) {
              ({ data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: context.payload.workflow_run.id }));
            } else {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                ...context.repo, head_sha: sourceSha, status: "success", per_page: 100
              });
              const candidate = runs.find(item => item.head_sha === sourceSha && item.path === ".github/workflows/ci.yml" && item.conclusion === "success");
              if (candidate) ({ data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: candidate.id }));
            }
            if (!run || run.head_sha !== sourceSha || run.path !== ".github/workflows/ci.yml"
                || run.conclusion !== "success" || run.head_repository?.full_name !== "MeherBenSalem/DonutAuction") {
              throw new Error("No successful full CI for this exact source commit");
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: run.id, filter: "all", per_page: 100
            });
            const requiredSteps = ["Run mvn -B -q test", "Native MySQL history, row claims and legacy schema migration", "Run node --test scripts/release-helpers.test.mjs"];
            for (const name of ["test (17)", "test (21)"]) {
              const job = jobs.filter(candidate => candidate.name === name).sort((a, b) => b.id - a.id)[0];
              if (!job || job.conclusion !== "success" || !requiredSteps.every(name => job.steps.some(step => step.name === name && step.conclusion === "success"))) {
                throw new Error("Java 17/21, native MySQL and release-helper CI must all pass");
              }
            }
            const recoveryRunId = context.payload.inputs?.artifact_run_id;
            if (recoveryRunId) {
              if (!/^[0-9]+$/.test(recoveryRunId)) throw new Error("Invalid artifact recovery run ID");
              const { data: previous } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: Number(recoveryRunId) });
              if (previous.name !== "Publish") {
                throw new Error("Recovery artifact must belong to this repository publication workflow");
              }
            }
            core.setOutput("source_sha", sourceSha);
            core.setOutput("run_id", String(run.id));
            core.info(`Release source ${sourceSha}; verified full CI ${run.id}`);

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ci.outputs.source_sha }}

      - name: Resolve version
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            echo "Provide a v*.*.* tag or workflow_dispatch version" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a numeric major.minor.patch version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        if: ${{ inputs.artifact_run_id == '' }}
        run: |
          mvn -B -q versions:set -DnewVersion="${{ steps.ver.outputs.version }}" -DgenerateBackupPoms=false
          mvn -B -q package

      - name: Recover original artifact
        if: ${{ inputs.artifact_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: DonutAuctionHouse-${{ steps.ver.outputs.version }}
          path: target
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Recover original publication receipts
        if: ${{ inputs.artifact_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: publication-receipts-${{ steps.ver.outputs.version }}
          path: recovery-receipts
          merge-multiple: true
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Verify recovered artifact source and immutable hash
        if: ${{ inputs.artifact_run_id != '' }}
        env:
          SOURCE_COMMIT: ${{ steps.ci.outputs.source_sha }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node --input-type=module - <<'JS'
          import fs from "node:fs";
          import { hashes } from "./scripts/release-helpers.mjs";
          const previous = JSON.parse(fs.readFileSync("recovery-receipts/release-provenance-receipt.json", "utf8"));
          const filename = `DonutAuctionHouse-${process.env.VERSION}.jar`;
          const digest = hashes(fs.readFileSync(`target/${filename}`));
          if (previous.source_commit !== process.env.SOURCE_COMMIT || previous.version !== process.env.VERSION
              || previous.filename !== filename || previous.hashes?.sha512 !== digest.sha512 || previous.hashes?.sha256 !== digest.sha256) {
            throw new Error("Recovered artifact does not match the exact checked source commit and original hashes");
          }
          JS

      - name: Locate jar
        id: jar
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          JAR="target/DonutAuctionHouse-${VERSION}.jar"
          if [ ! -f "$JAR" ]; then
            echo "Expected $JAR after Maven package" >&2
            ls -la target || true
            exit 1
          fi
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: node --test scripts/release-helpers.test.mjs

      - name: Preserve immutable release jar
        uses: actions/upload-artifact@v4
        with:
          name: DonutAuctionHouse-${{ steps.ver.outputs.version }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Record immutable release provenance
        env:
          SOURCE_COMMIT: ${{ steps.ci.outputs.source_sha }}
          CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
          VERSION: ${{ steps.ver.outputs.version }}
          JAR_PATH: ${{ steps.jar.outputs.path }}
        run: |
          node --input-type=module - <<'JS'
          import fs from "node:fs";
          import { hashes } from "./scripts/release-helpers.mjs";
          fs.writeFileSync("release-provenance-receipt.json", JSON.stringify({
            source_commit: process.env.SOURCE_COMMIT, ci_run_id: Number(process.env.CI_RUN_ID),
            version: process.env.VERSION, filename: process.env.JAR_PATH.split("/").pop(),
            hashes: hashes(fs.readFileSync(process.env.JAR_PATH)),
            support: JSON.parse(fs.readFileSync("release/supported-minecraft.json", "utf8"))
          }, null, 2));
          JS

      - name: Upload Modrinth + CurseForge
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
          JAR_PATH: ${{ steps.jar.outputs.path }}
          PLATFORMS: ${{ inputs.platforms || 'both' }}
          PREFLIGHT_ONLY: ${{ inputs.dry_run || 'false' }}
          RECOVERY_RECEIPTS: recovery-receipts
        run: node scripts/publish-release.mjs

      - name: Preserve publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-receipts-${{ steps.ver.outputs.version }}
          path: '*receipt.json'
          if-no-files-found: ignore
          retention-days: 90
