# Publish DonutAuctionHouse to Modrinth and CurseForge on v*.*.* tags.
# One jar, one version, tagged Paper + Folia for every Minecraft version in
# release/supported-minecraft.json (1.20.1 through 26.3).
#
# Secrets: MODRINTH_TOKEN, CURSEFORGE_TOKEN, CURSEFORGE_API_KEY
# Variables: MODRINTH_ID, CURSEFORGE_ID

name: Publish

on:
  # Temporary opt-in for the explicitly authorized 1.6.0 release only.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v) when not tagging
        required: false
      dry_run:
        description: Skip uploads if true
        required: false
        default: "false"
      platforms:
        description: "modrinth, curseforge, or both"
        required: false
        default: "both"
      artifact_run_id:
        description: "Recover only missing uploads from this existing run's immutable jar"
        required: false

concurrency:
  group: donutauction-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify full CI for the exact release commit
        id: ci
        uses: actions/github-script@v7
        with:
          script: |
            const sourceSha = context.payload.workflow_run?.head_sha || context.sha;
            let run;
            if (context.payload.workflow_run) {
              ({ data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: context.payload.workflow_run.id }));
            } else {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                ...context.repo, head_sha: sourceSha, status: "success", per_page: 100
              });
              const candidate = runs.find(item => item.head_sha === sourceSha && item.path === ".github/workflows/ci.yml" && item.conclusion === "success");
              if (candidate) ({ data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: candidate.id }));
            }
            if (!run || run.head_sha !== sourceSha || run.path !== ".github/workflows/ci.yml"
                || run.conclusion !== "success" || run.head_repository?.full_name !== "MeherBenSalem/DonutAuction") {
              throw new Error("No successful full CI for this exact source commit");
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: run.id, filter: "all", per_page: 100
            });
            const requiredSteps = ["Run mvn -B -q test", "Native MySQL history, row claims and legacy schema migration", "Run node --test scripts/release-helpers.test.mjs"];
            for (const name of ["test (17)", "test (21)"]) {
              const job = jobs.filter(candidate => candidate.name === name).sort((a, b) => b.id - a.id)[0];
              if (!job || job.conclusion !== "success" || !requiredSteps.every(name => job.steps.some(step => step.name === name && step.conclusion === "success"))) {
                throw new Error("Java 17/21, native MySQL and release-helper CI must all pass");
              }
            }
            const recoveryRunId = context.payload.inputs?.artifact_run_id;
            if (recoveryRunId) {
              if (!/^[0-9]+$/.test(recoveryRunId)) throw new Error("Invalid artifact recovery run ID");
              const { data: previous } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: Number(recoveryRunId) });
              if (previous.name !== "Publish") {
                throw new Error("Recovery artifact must belong to this repository publication workflow");
              }
            }
            core.setOutput("source_sha", sourceSha);
            core.setOutput("run_id", String(run.id));
            core.info(`Release source ${sourceSha}; verified full CI ${run.id}`);

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ci.outputs.source_sha }}

      - name: Resolve version
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            VERSION="1.6.0"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            echo "Provide a v*.*.* tag or workflow_dispatch version" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a numeric major.minor.patch version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        if: ${{ inputs.artifact_run_id == '' }}
        run: |
          mvn -B -q versions:set -DnewVersion="${{ steps.ver.outputs.version }}" -DgenerateBackupPoms=false
          mvn -B -q package

      - name: Recover original artifact
        if: ${{ inputs.artifact_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: DonutAuctionHouse-${{ steps.ver.outputs.version }}
          path: target
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Recover original publication receipts
        if: ${{ inputs.artifact_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: publication-receipts-${{ steps.ver.outputs.version }}
          path: recovery-receipts
          merge-multiple: true
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Verify recovered artifact source and immutable hash
        if: ${{ inputs.artifact_run_id != '' }}
        env:
          SOURCE_COMMIT: ${{ steps.ci.outputs.source_sha }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node --input-type=module - <<'JS'
          import fs from "node:fs";
          import { hashes } from "./scripts/release-helpers.mjs";
          const previous = JSON.parse(fs.readFileSync("recovery-receipts/release-provenance-receipt.json", "utf8"));
          const filename = `DonutAuctionHouse-${process.env.VERSION}.jar`;
          const digest = hashes(fs.readFileSync(`target/${filename}`));
          if (previous.source_commit !== process.env.SOURCE_COMMIT || previous.version !== process.env.VERSION
              || previous.filename !== filename || previous.hashes?.sha512 !== digest.sha512 || previous.hashes?.sha256 !== digest.sha256) {
            throw new Error("Recovered artifact does not match the exact checked source commit and original hashes");
          }
          JS

      - name: Locate jar
        id: jar
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          JAR="target/DonutAuctionHouse-${VERSION}.jar"
          if [ ! -f "$JAR" ]; then
            echo "Expected $JAR after Maven package" >&2
            ls -la target || true
            exit 1
          fi
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: node --test scripts/release-helpers.test.mjs

      - name: Preserve immutable release jar
        uses: actions/upload-artifact@v4
        with:
          name: DonutAuctionHouse-${{ steps.ver.outputs.version }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Record immutable release provenance
        env:
          SOURCE_COMMIT: ${{ steps.ci.outputs.source_sha }}
          CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
          VERSION: ${{ steps.ver.outputs.version }}
          JAR_PATH: ${{ steps.jar.outputs.path }}
        run: |
          node --input-type=module - <<'JS'
          import fs from "node:fs";
          import { hashes } from "./scripts/release-helpers.mjs";
          fs.writeFileSync("release-provenance-receipt.json", JSON.stringify({
            source_commit: process.env.SOURCE_COMMIT, ci_run_id: Number(process.env.CI_RUN_ID),
            version: process.env.VERSION, filename: process.env.JAR_PATH.split("/").pop(),
            hashes: hashes(fs.readFileSync(process.env.JAR_PATH)),
            support: JSON.parse(fs.readFileSync("release/supported-minecraft.json", "utf8"))
          }, null, 2));
          JS

      - name: Upload Modrinth + CurseForge
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
          JAR_PATH: ${{ steps.jar.outputs.path }}
          PLATFORMS: ${{ inputs.platforms || 'both' }}
          PREFLIGHT_ONLY: ${{ inputs.dry_run || 'false' }}
          RECOVERY_RECEIPTS: recovery-receipts
        run: node scripts/publish-release.mjs

      - name: Preserve publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-receipts-${{ steps.ver.outputs.version }}
          path: '*receipt.json'
          if-no-files-found: ignore
          retention-days: 90

  verify_publication:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == '563915562309c1b80acc5fad7a7f91a66df96253' && github.event.workflow_run.head_repository.full_name == 'MeherBenSalem/DonutAuction' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 563915562309c1b80acc5fad7a7f91a66df96253
      - uses: actions/download-artifact@v4
        with:
          name: DonutAuctionHouse-1.6.0
          path: verified-artifact
          run-id: 37631403342
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: publication-receipts-1.6.0
          path: original-receipts
          run-id: 37631403342
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify both public downloads without creating another upload
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          node --input-type=module - <<'JS'
          import fs from "node:fs";
          import { setTimeout as delay } from "node:timers/promises";
          import { hashes, verifyModrinth, verifyCurseForge, verifyCurseForgeProject } from "./scripts/release-helpers.mjs";
          const version = "1.6.0";
          const bytes = fs.readFileSync("verified-artifact/DonutAuctionHouse-1.6.0.jar");
          const digest = hashes(bytes);
          const prior = JSON.parse(fs.readFileSync("original-receipts/release-provenance-receipt.json", "utf8"));
          const accepted = JSON.parse(fs.readFileSync("original-receipts/curseforge-upload-receipt.json", "utf8"));
          if (prior.source_commit !== "563915562309c1b80acc5fad7a7f91a66df96253" || prior.version !== version
              || prior.hashes.sha256 !== digest.sha256 || digest.sha256 !== "8bebbd29635de79214bf8794d59423badaea648e6aaf5e038c1f5e6bb3348814"
              || accepted.project_id !== "1479926" || accepted.upload.id !== 9089309 || accepted.sha256 !== digest.sha256) {
            throw new Error("Publication proof does not match the accepted immutable release");
          }
          const support = prior.support;
          async function json(url, headers = {}) {
            const response = await fetch(url, { headers });
            if (!response.ok) throw new Error(`Read failed ${response.status}: ${url}`);
            return response.json();
          }
          async function publicDownload(url) {
            const target = new URL(url);
            if (target.protocol !== "https:" || !(target.hostname === "cdn.modrinth.com" || target.hostname.endsWith(".forgecdn.net"))) {
              throw new Error("Unexpected public release download destination");
            }
            const response = await fetch(url);
            if (!response.ok) return false;
            if (hashes(Buffer.from(await response.arrayBuffer())).sha256 !== digest.sha256) {
              throw new Error("Public download bytes do not match the immutable release");
            }
            return true;
          }
          const mr = await json("https://api.modrinth.com/v2/version/xFhXuWyO");
          verifyModrinth(mr, "8XgyeSRH", version, support, digest);
          if (!await publicDownload(mr.files.find(file => file.primary).url)) throw new Error("Modrinth public download unavailable");
          console.log("Modrinth public metadata and SHA256 verified", mr.id, digest.sha256);
          const cfHeaders = { "x-api-key": process.env.CURSEFORGE_API_KEY };
          verifyCurseForgeProject((await json("https://api.curseforge.com/v1/mods/1479926", cfHeaders)).data);
          for (;;) {
            const response = await fetch("https://api.curseforge.com/v1/mods/1479926/files/9089309", { headers: cfHeaders });
            if (response.status === 404 || response.status >= 500) {
              console.log("CurseForge accepted file 9089309 is not public in the API yet", response.status);
              await delay(60000); continue;
            }
            if (!response.ok) throw new Error(`CurseForge verification read failed ${response.status}`);
            const cf = (await response.json()).data;
            if ([2, 5, 6, 7, 8, 12, 15].includes(cf.fileStatus)) throw new Error(`CurseForge requires action: file status ${cf.fileStatus}`);
            console.log("CurseForge accepted file", cf.id, "status", cf.fileStatus, "available", cf.isAvailable);
            if (!cf.isAvailable || ![4, 10].includes(cf.fileStatus)) { await delay(60000); continue; }
            verifyCurseForge(cf, "1479926", version, support, digest);
            if (!["Client", "Server"].every(tag => cf.gameVersions.includes(tag))) throw new Error("CurseForge environment tags missing");
            if (cf.downloadUrl && await publicDownload(cf.downloadUrl)) {
              fs.writeFileSync("public-verification-receipt.json", JSON.stringify({
                checked_at: new Date().toISOString(), source_commit: prior.source_commit,
                version, hashes: digest, modrinth: mr, curseforge: cf
              }, null, 2));
              console.log("BOTH PUBLIC RELEASE DOWNLOADS VERIFIED", digest.sha256);
              break;
            }
            await delay(60000);
          }
          JS
      - name: Preserve public verification proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-verification-1.6.0
          path: public-verification-receipt.json
          if-no-files-found: ignore
          retention-days: 90

